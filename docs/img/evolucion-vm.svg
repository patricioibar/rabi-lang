<text x="358.0" y="342.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">Tras opt. 1</text>
<text x="358.0" y="358.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">globales sin copiar</text>
<text x="358.0" y="374.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">el nombre</text>
<path d="M 502.7 318.0 V 272.4 Q 502.7 268.4 506.7 268.4 H 590.7 Q 594.7 268.4 594.7 272.4 V 318.0 Z" fill="#2a78d6"/>
<text x="548.7" y="258.4" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums">280 ms</text>
<text x="548.7" y="342.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">VM final</text>
<text x="548.7" y="358.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">(todas las</text>
<text x="548.7" y="374.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">optimizaciones)</text>
<text x="12.0" y="56.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">ms</text>
</svg>
