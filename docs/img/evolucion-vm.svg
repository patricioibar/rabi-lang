<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="388" viewBox="0 0 840 388" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="titulo desc">
<title id="titulo">Evolución de la VM a lo largo del desarrollo</title>
<desc id="desc">La VM arranca en 1363 ms, por encima del intérprete, baja a 678 ms tras la primera optimización y termina en 280 ms, menos de la mitad de los 602 ms del intérprete.</desc>
<rect width="840" height="388" fill="#fcfcfb"/>
<rect x="0.5" y="0.5" width="839" height="387" fill="none" stroke="#e1e0d9"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Evolución de la VM a lo largo del desarrollo</text>
