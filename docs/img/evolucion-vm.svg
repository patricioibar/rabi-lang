<text x="60.0" y="251.1" font-size="11" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">400</text>
<line x1="72.0" y1="211.7" x2="644.0" y2="211.7" stroke="#e1e0d9" stroke-width="1"/>
<text x="60.0" y="215.7" font-size="11" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">600</text>
<line x1="72.0" y1="176.3" x2="644.0" y2="176.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="60.0" y="180.3" font-size="11" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">800</text>
<line x1="72.0" y1="140.9" x2="644.0" y2="140.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="60.0" y="144.9" font-size="11" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">1000</text>
<line x1="72.0" y1="105.4" x2="644.0" y2="105.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="60.0" y="109.4" font-size="11" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">1200</text>
<line x1="72.0" y1="70.0" x2="644.0" y2="70.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="60.0" y="74.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" style="font-variant-numeric: tabular-nums">1400</text>
<line x1="72.0" y1="318.0" x2="644.0" y2="318.0" stroke="#c3c2b7" stroke-width="1"/>
<line x1="72.0" y1="150.6" x2="644.0" y2="150.6" stroke="#898781" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="654.0" y="148.6" font-size="11" fill="#898781" text-anchor="start" font-weight="400">intérprete en ese momento</text>
<text x="654.0" y="164.6" font-size="11" fill="#898781" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">945 ms</text>
<line x1="72.0" y1="211.4" x2="644.0" y2="211.4" stroke="#52514e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="654.0" y="209.4" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">intérprete final (make bench)</text>
<text x="654.0" y="225.4" font-size="11" fill="#52514e" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">602 ms</text>
<path d="M 121.3 318.0 V 80.6 Q 121.3 76.6 125.3 76.6 H 209.3 Q 213.3 76.6 213.3 80.6 V 318.0 Z" fill="#2a78d6"/>
<text x="167.3" y="66.6" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" style="font-variant-numeric: tabular-nums">1363 ms</text>
<text x="167.3" y="342.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">VM inicial</text>
